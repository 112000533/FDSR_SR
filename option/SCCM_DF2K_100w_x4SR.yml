name: SCCM_train_DF2K_100w_x4SR
model_type: SRModel
scale: 4
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: /path to your GTdata
    dataroot_lq: /path to your LQdata
    filename_tmpl: '{}'
    io_backend:
      type: lmdb #disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 12 #12
    batch_size_per_gpu: 64 # 64
    dataset_enlarge_ratio: 10
    pin_memory: true
    prefetch_mode: cuda
    persistent_worker: true

  val:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /media/how/data2/CODES/imageSR/datasets/Benchmark/HR/Set5/x4
    dataroot_lq: /media/how/data2/CODES/imageSR/datasets/Benchmark/LR/Set5/x4
    filename_tmpl : "{}"#x4
    io_backend:
      type: disk


# network structures
network_g:
  type: SCMNet
  dim: 36 #48
  n_blocks: 8 # 12
  ffn_scale: 2
  upscaling_factor: 4

# path
path:
  pretrain_network_g: ~
  strict_load_g: False
  resume_state: ~

# training settings~
train:
  ema_decay: 0.999 #
  optim_g:
    type: Adam #
    lr: !!float 1e-3 #
    weight_decay: 0
    betas: [0.9, 0.99] #

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1000000] #1000000
    restart_weights: [1] #
    eta_min: !!float 1e-6 #

  total_iter: 1000000 #
  warmup_iter: -1 #no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  fft_opt:
    type: FFTLoss
    loss_weight: 0.05 #
    reduction: mean

# validation settings
val:
  val_freq: !!float 5000 #
  save_img: False
  pbar: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
      better: higher  # the higher, the better. Default: higher
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
      better: higher  # the higher, the better. Default: higher

# logging settings
logger:
  print_freq: 500 #500
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
